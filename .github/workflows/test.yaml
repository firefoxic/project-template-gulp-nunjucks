name: Test

on:
  pull_request:
    branches:
      - '*'

env:
  FORCE_COLOR: 2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          version: latest
      - run: make setup
      - run: make lint
      - run: NODE_ENV=production node --run ./node_modules/.bin/gulp -- processMarkup
      - run: pnpm dlx w3c-html-validator dist/**/*.html
      - run: pnpm dlx @firefoxic/bemlint dist/**/*.html
